<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>板凳出窗 · CHAIR RIOT</title>
  <desc>原创程序绘制图标：暖橙色板凳冲破青绿色夜窗，碎玻璃和速度线。2026-10-17。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143b50"/>
      <stop offset="1" stop-color="#081723"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#286a78"/>
      <stop offset="1" stop-color="#123648"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdb83"/>
      <stop offset="1" stop-color="#f59448"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background; no transparent corners, so launchers can apply their own mask. -->
  <rect width="512" height="512" fill="url(#night)"/>
  <path d="M0 395L395 0H512V118L118 512H0Z" fill="#1d5363" opacity="0.25"/>
  <path d="M32 440H480" stroke="#27606c" stroke-width="4"/>
