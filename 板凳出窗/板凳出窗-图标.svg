  <g transform="translate(258 259) rotate(-24)" stroke="#16242d" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-62 -8L-76 112M62 -8L79 112" fill="none" stroke-width="27"/>
    <path d="M-62 -8L-76 112M62 -8L79 112" fill="none" stroke="#ef9b4b" stroke-width="13"/>
