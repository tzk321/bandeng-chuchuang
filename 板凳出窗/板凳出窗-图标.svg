  <path d="M369 268L376 246L383 265L402 272L381 280L374 300L368 280L347 274Z" fill="#fff1c2"/>
  <path d="M192 129L198 115L202 129L216 133L203 139L198 152L193 140L180 135Z" fill="#fff5cc"/>
