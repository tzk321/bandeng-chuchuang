    <path d="M-71 70H73" fill="none" stroke="#ffc96c" stroke-width="9"/>
    <path d="M-65 -8V-99Q-65 -112 -50 -112H48Q63 -112 63 -99V-8Z" fill="url(#wood)"/>
    <path d="M-39 -81H37M-39 -58H37" fill="none" stroke="#c8773d" stroke-width="9"/>
    <path d="M-81 -23H80L93 11Q95 23 81 23H-82Q-96 23 -93 11Z" fill="#f7ad56"/>
    <path d="M-72 -13H70" fill="none" stroke="#ffe5a0" stroke-width="8"/>
  </g>
